<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No todo lo posible...</title>
  <style>
    :root {
      --gold: #d4af37;
      --warm-white: #f2eadc;
      --muted: rgba(242, 234, 220, 0.9);
      --shadow: rgba(0, 0, 0, 0.52);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #05070b;
    }

    body {
      font-family: Inter, Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--warm-white);
      overflow: hidden;
    }

    .title-slide {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(32px, 6vw, 88px);
      isolation: isolate;
      background:
        radial-gradient(circle at 52% 34%, rgba(212, 175, 55, 0.18), transparent 28%),
        radial-gradient(circle at 18% 18%, rgba(102, 157, 190, 0.18), transparent 34%),
        linear-gradient(135deg, #020307 0%, #08101a 42%, #130f12 100%);
    }

    .title-slide::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(115deg, rgba(0, 0, 0, 0.74), rgba(0, 0, 0, 0.34) 48%, rgba(0, 0, 0, 0.72));
    }

    .title-slide::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.42;
      background:
        radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.28) 62%, rgba(0, 0, 0, 0.68) 100%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 18%, rgba(0, 0, 0, 0.24));
      pointer-events: none;
    }

    .content {
      width: min(980px, 100%);
      text-align: center;
      text-shadow: 0 22px 58px var(--shadow);
    }

    .name,
    .phrase {
      font-family: "Playfair Display", "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
      font-weight: 400;
      color: var(--gold);
      letter-spacing: 0.035em;
    }

    .name {
      margin: 0;
      font-size: clamp(2.4rem, 5.2vw, 5.6rem);
      line-height: 0.98;
    }

    .credentials {
      display: grid;
      gap: 0.68rem;
      margin: clamp(34px, 5vh, 58px) auto 0;
      color: var(--muted);
    }

    .credentials p {
      margin: 0;
      font-size: clamp(0.92rem, 1.25vw, 1.18rem);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    .phrase {
      margin: clamp(58px, 8vh, 94px) 0 0;
      font-size: clamp(0.97rem, 1.31vw, 1.24rem);
      line-height: 1.2;
      color: rgba(212, 175, 55, 0.96);
    }

    .fade {
      opacity: 0;
      transform: translateY(14px);
      filter: blur(4px);
      animation: reveal 1.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .fade.name {
      animation-delay: 0.25s;
    }

    .fade.credentials {
      animation-delay: 0.95s;
    }

    .fade.phrase {
      animation-delay: 1.75s;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @media (max-width: 680px) {
      body {
        overflow: auto;
      }

      .title-slide {
        padding: 40px 24px;
      }

      .credentials {
        gap: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade {
        animation: none;
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
  </style>
</head>
<body>
  <main class="title-slide" aria-label="Portada de presentación">
    <section class="content">
      <h1 class="name fade">Dra. Liliana Vera Bahamonde</h1>

      <div class="credentials fade" aria-label="Credenciales">
        <p>Médico Cirujano – Universidad Mayor – Hospital de Castro</p>
        <p>PhD in Philosophy (Aesthetics and Metaphysics) – Stanford University</p>
      </div>

      <p class="phrase fade">No todo lo posible…</p>
    </section>
  </main>

  <script>
    document.documentElement.classList.add("ready");
  </script>
</body>
</html>
