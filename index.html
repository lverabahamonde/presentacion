    /* v2 cinematic refactor · global visual system extracted from the minimalist title slide */
    :root{
      --bg:#030305;--bg2:#08090d;--ink:#f0e7d8;--muted:rgba(240,231,216,.68);--soft:rgba(240,231,216,.86);
      --line:rgba(240,231,216,.16);--line2:rgba(212,175,55,.26);
      --cyan:#86b9c8;--amber:#d4af37;--violet:#9d8ab7;--steel:#9a9a96;
      --surface:rgba(10,11,14,.76);--surface2:rgba(240,231,216,.055);
      --font-display:"Playfair Display",Georgia,"Times New Roman",serif;
      --font-body:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --size-hero:clamp(2.5rem,6.8vw,7.4rem);--size-title:clamp(2.2rem,5vw,5.8rem);
      --size-lede:clamp(1.02rem,1.7vw,1.45rem);--size-small:.8rem;
      --wrap:min(1180px,calc(100vw - 72px));--shadow:0 30px 100px rgba(0,0,0,.48);
    }
    html{background:var(--bg)}
    body{
      background:
        linear-gradient(rgba(3,5,10,.36),rgba(3,5,10,.40)),
        radial-gradient(circle at 50% 22%,rgba(212,175,55,.13),transparent 32%),
        radial-gradient(circle at 22% 78%,rgba(134,185,200,.09),transparent 30%),
        radial-gradient(circle at 78% 18%,rgba(120,74,48,.14),transparent 36%),
        linear-gradient(135deg,#020306 0%,#090b10 48%,#030305 100%);
      color:var(--ink);
      font-family:var(--font-body);
    }
    body:before{
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
      background-size:52px 52px;
      opacity:.44;
    }
    body:after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(circle at center,transparent 0 44%,rgba(0,0,0,.40) 100%),
        linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.34));
    }
    .app-shell{position:relative;z-index:1}
    .section,.closing,.act-break,.simpsons-compact,.personal-reveal,.closing-synthesis,.bibliography-final{
      background:
        linear-gradient(rgba(3,5,10,.34),rgba(3,5,10,.38)),
        radial-gradient(circle at 50% 28%,rgba(212,175,55,.07),transparent 38%),
        linear-gradient(180deg,#030305,#08090d 48%,#030305)!important;
    }
    .inner{width:var(--wrap)}
    .narrow{max-width:880px}
    .scene-title,.statement,.quote,.act-title,.interlude-title,.case-slide-title,.case-slide-final,.final-phrase,.simpsons-final,.closing-lines p,.reveal-line,.reveal-final,.tlt-final,.family-final,.monitor-bottom,.proportional-final{
      font-family:var(--font-display);
      font-weight:400!important;
    }
    .scene-title,.statement,.act-title,.interlude-title,.cover-title{
      text-transform:none!important;
      letter-spacing:-.045em;
    }
    .kicker,.act-number,.case-screen-type,.case-block h3,.monitor-card h3,.flow-stage h3,.question-box b,.tlt-step .time,.family-panel h3,.biblio-block h3,.simpsons-card h3,.pop-credit,.cover-credential{
      text-transform:none!important;

    editHelp:["Busque el bloque `const CONTENT = { ... }` al inicio del script.","Para cambiar portada edite `CONTENT.cover.title`, `author` y `credentials`.","Para ocultar una sección cambie `enabled: false` en esa escena.","Para ajustar el guion de 30 minutos edite `CONTENT.guide30.scenes`.","Para cambiar actos edite `CONTENT.acts` y el mapa `ACT_BY_SCENE` en el motor.","Para afilar o retirar filosofía edite `CONTENT.philosophers`; si un autor no cambia una decisión, muévalo a `CONTENT.references`.","Para ritmo en vivo use `X`: no borra escenas, sólo activa una señal visual para pasar rápido lo opcional.","Para desactivar QR/material posterior use `CONTENT.config.showQr = false`.","Para ocultar la escena pública de revelación use `CONTENT.config.showPersonalReveal = false`; para quitar revelaciones de notas use `CONTENT.config.showBiographicalRevealNotes = false`.","Para desactivar fotos pop use `CONTENT.config.usePopImages = false`. Para versión pública use `CONTENT.config.publicSafeMode = true`.","Las fotos pop se leen desde `assets/pop/`; use JPG/WebP comprimidos, idealmente menores de 700 KB.","Para revisar privacidad presione `V`; para preflight técnico presione `D`.","Para modo cine durante reunión presione `H`."],

        "no-es-aet":{say30:"Aclarar rápido qué no es AET: abandono, eutanasia, ahorro de cama ni edadismo.",expandIfTime:"Usar esta escena para desactivar defensas antes de los casos.",skipOrMention:"Leer la lista y avanzar.",time30:"35 segundos"},
        "definicion-aet":{say30:"Definir AET: ajustar intensidad terapéutica a fines clínicos razonables.",expandIfTime:"Aclarar que puede significar respetar, detener o escalar.",skipOrMention:"Dejar sólo: no es hacer menos; es ajustar medios a fines.",time30:"45 segundos"},
        "aet-intervenciones":{say30:"La AET juzga intervenciones, no vidas.",expandIfTime:"Insistir en que el valor de la persona nunca está en evaluación.",skipOrMention:"Dejar sólo: se juzga el tratamiento, no la vida.",time30:"35 segundos"},
        "edad-no-decide":{say30:"La edad no decide: decide la proporcionalidad clínica, la reversibilidad y los valores.",expandIfTime:"Distinguir edad, fragilidad, trayectoria y objetivo terapéutico.",skipOrMention:"Dejar sólo: la edad no es indicación ni contraindicación automática.",time30:"35 segundos"},
        "interludio-batman":{say30:"Batman sirve para mostrar que poder hacer algo no basta: hay límites morales.",expandIfTime:"Explicar utilitarismo, deontología y prudencia clínica en tres frases.",skipOrMention:"Decir sólo: poder técnico no equivale a deber moral.",time30:"45 segundos"},

        "interludio-jurassic":{say30:"Jurassic Park traduce a Jonas: a mayor poder técnico, mayor responsabilidad moral.",expandIfTime:"Aplicar a VM, transfusión, ATB y UCI.",skipOrMention:"Decir sólo: la disponibilidad de una técnica no crea obligación de usarla.",time30:"30 segundos"},
        monitor:{say30:"El monitor ordena gravedad, pero no contiene voluntad, biografía ni sufrimiento. La AET empieza cuando esos datos se integran al juicio clínico.",expandIfTime:"Leer una variable fisiológica y una dimensión humana: ambas importan, pero sólo una aparece en la pantalla.",skipOrMention:"Pasar con: los datos orientan, no sustituyen el juicio clínico.",time30:"45 segundos"},
        "vida-post-alta":{say30:"Después del caso de escalar: la ficha cierra antes que la historia; la sobrevida no es binaria.",expandIfTime:"Nombrar secuela, proyecto interrumpido, rehabilitación y reconstrucción sin volverlo testimonial.",skipOrMention:"Decir sólo: no basta preguntar si vive; hay que preguntar a qué vida vuelve.",time30:"1 min"},
        "caso-respetar-ficha":{say30:"Presentar datos clínicos del caso de rechazo informado.",expandIfTime:"Nombrar fragilidad, autovalencia, neumonía y rechazo de hospitalización sin convertirlo en biografía.",skipOrMention:"Dejar sólo: mujer 83 años, neumonía, rechaza hospitalización.",time30:"1 min"},
        "caso-respetar-aet":{say30:"Explicar capacidad, comprensión, familia que apoya, cuidado activo y desenlace.",expandIfTime:"Conectar rechazo informado, no abandono, bien real de la paciente y muerte acompañada sin disnea.",skipOrMention:"Dejar sólo: respetar fue cuidado.",time30:"3 min"},
        "caso-detener-ficha":{say30:"Presentar carga clínica acumulada y hospitalización prolongada.",expandIfTime:"Nombrar cáncer avanzado, sangrado persistente, politransfusión, caquexia, dependencia, VAC y falla renal.",skipOrMention:"Dejar sólo: cáncer avanzado, sangrado persistente, politransfusión.",time30:"1.5 min"},
        "caso-detener-aet":{say30:"Explicar por qué la transfusión dejó de cumplir objetivo terapéutico.",expandIfTime:"Separar transfusión como puente de transfusión como sostén de cifra sin trayectoria modificable.",skipOrMention:"Dejar sólo: sostener hemoglobina no siempre sostiene vida recuperable.",time30:"2.5 min"},
        "caso-detener-desenlace":{say30:"Cerrar con sostener una variable no siempre es sostener una vida.",expandIfTime:"Mostrar que la recomendación clínica debe ser del equipo, aunque la familia abra la pregunta.",skipOrMention:"Dejar sólo: detener fue cuidado.",time30:"1 min"},
        "caso-escalar-ficha":{say30:"Presentar gravedad extrema.",expandIfTime:"Nombrar politrauma, hemotórax, TEC, paros recuperados, VM, drogas, cirugía, UCI y rehabilitación.",skipOrMention:"Dejar sólo: paciente joven, politrauma grave, UCI.",time30:"1 min"},
        "caso-escalar-aet":{say30:"Explicar por qué escalar fue proporcional y cerrar con desenlace: UCI como puente, no intensidad por sí misma.",expandIfTime:"Conectar finalidad clínica, reversibilidad plausible, rehabilitación, secuelas y vida posterior.",skipOrMention:"Dejar sólo: escalar fue cuidado.",time30:"3 min"},
        "sintesis-casos":{say30:"Los casos muestran que AET no es una dirección única: respetar, detener y escalar pueden ser cuidado.",expandIfTime:"Leer una línea por caso y cerrar con la pregunta sobre qué sigue sirviendo al paciente.",skipOrMention:"Dejar sólo: no se trata de hacer más o menos, sino lo que todavía sirve.",time30:"2 min"},
        reversible:{say30:"Reversible no significa recuperable; recuperable no significa aceptable.",expandIfTime:"Aplicar a vida basal recuperable.",skipOrMention:"Decir sólo: la pregunta es a qué vida puede volver.",time30:"1 min"},
        proporcionalidad:{say30:"Proporcionalidad significa preguntar por objetivo, beneficio, carga y valores antes de escalar o mantener una intervención.",expandIfTime:"Mostrar el flujo: intervención candidata, cuatro preguntas, recomendación AET.",skipOrMention:"Dejar la frase: proporcional es lo que todavía tiene finalidad para este paciente.",time30:"1 min"},
        "interludio-ring":{say30:"El Anillo es opcional: no todo poder disponible debe usarse.",expandIfTime:"Usarlo si el grupo está conectado con las analogías.",skipOrMention:"Pasar rápido: el poder técnico necesita disciplina moral.",time30:"20 segundos"},

        "interludio-simpsons-compacto":{say30:"Los Simpson van como una sola cápsula: prolongar, seducirse con tecnología o hacer algo por ansiedad no siempre es cuidado.",expandIfTime:"Leer una línea por mini-idea y volver a objetivo terapéutico.",skipOrMention:"Dejar sólo: hacer algo no siempre es hacer lo correcto.",time30:"45 segundos"},

        "revelacion-personal":{say30:"Hasta aquí los presenté como casos clínicos, porque eso eran. Pero no eran sólo casos clínicos: eran mi abuela, mi padre y yo. En mi vida la AET tuvo tres formas: respetar, detener y escalar.",expandIfTime:"Pausar después de la revelación. No sobreexplicar. Dejar que la frase trabaje.",skipOrMention:"Si falta tiempo, decir sólo la frase final y pasar al cierre.",time30:"1 min"},

      {id:"batman",enabled:true,priority:"core",title:"BATMAN Y EL GUASÓN",universe:"Batman",concept:"límites morales · utilitarismo · deontología · prudencia",visual:"moral",visibleText:["Batman puede hacerlo. Pero no todo poder se convierte en deber.","UTILITARISMO · consecuencias","DEONTOLOGÍA · límites","PRUDENCIA · caso concreto"],clinicalBridge:"En UCI, RCP, ventilador, transfusión o antibiótico disponible no significan obligación automática.",keyPhrase:"Poder técnico no equivale a deber moral.",relatedPhilosophy:["utilitarismo","deontología","prudencia clínica"],notes:{say:"No es chiste: es un atajo filosófico sobre límites. Usar máximo 45-60 segundos y volver a UCI, RCP, ventilador, transfusión y antibiótico.",warning:"No discutir Batman como fandom; usarlo para explicar que consecuencias favorables no justifican cualquier medio.",maxTime:"60 segundos",humor:"En UPC no estamos en Gotham, aunque algunas noches se parece."}},

      {id:"prueba",type:"limitedTrialTimeline",enabled:true,nav:"Prueba limitada",eyebrow:"Prueba terapéutica limitada",title:"La incertidumbre no justifica inercia. Justifica método.",lead:"Una prueba limitada no es ‘probemos y vemos’. Es objetivo, plazo, criterios y decisión anticipada.",steps:[{time:"0 h · Objetivo",title:"Definir qué se intenta revertir.",text:"Ejemplo: perfusión, oxigenación, conciencia, control de infección, alivio de disnea."},{time:"24–48 h · Respuesta esperada",title:"Buscar tendencia, no milagro.",text:"Menor requerimiento de soporte, mejoría clínica, menor carga sintomática."},{time:"48–72 h · Criterios de fracaso",title:"Nombrar cuándo la intervención deja de ser puente.",text:"Más sufrimiento, nueva falla sin salida, sin tendencia favorable, carga creciente."},{time:"Reevaluación",title:"Si no cumple objetivo, se reorienta.",text:"No escalar por inercia. Mantener confort activo."}],final:"Una prueba limitada tiene fecha, objetivo y salida.",warning:"Sin criterios de fracaso, no es prueba: es inercia con bata.",notes:{say:"No siempre se sabe al inicio; por eso se define método y salida antes de iniciar.",ask:"¿Cuál sería aquí el criterio de fracaso?",tension:"prueba limitada versus escalada indefinida",pause:"30 segundos",skipIfShort:true,presenterEnergy:"medium",audienceValue:"support"}},
      {id:"retirar-cuidado",type:"scrollyStatement",enabled:true,nav:"Retirar cuidado",eyebrow:"Cuidado activo",title:"Retirar una intervención no es retirar el cuidado.",lead:"Cuando un soporte perdió finalidad, la AET no abandona: cambia el objetivo hacia alivio, presencia, comunicación y registro.",notes:{say:"Distinguir retirar desproporción de abandonar.",ask:"¿Qué cuidado debe intensificarse cuando se retira una intervención?",tension:"retirar soporte versus retirar cuidado",pause:"25 segundos"}},
      {id:"familia",type:"familyTranslation",enabled:true,nav:"Familia",eyebrow:"Comunicación y valores",title:"La familia no elige máquinas. Ayuda a reconstruir valores.",lead:"“Hagan todo” rara vez significa “quiero todas las intervenciones posibles”. Muchas veces significa: no lo abandonen.",panels:[{title:"Lo que se dice",big:"Hagan todo.",items:["No quiero abandonarlo.","No quiero decidir su muerte.","No entiendo el pronóstico.","Necesito tiempo.","Siento culpa."]},{title:"Lo que no corresponde",avoid:true,items:["¿Quieren que lo intubemos?","¿Quieren RCP?","¿Quieren que sigamos transfundiendo?","La familia decidió limitar."],note:"La recomendación clínica la formula el equipo."},{title:"La pregunta correcta",items:["¿Qué valoraba?","¿Qué temía?","¿Qué habría considerado aceptable?","¿Qué habría rechazado?","¿Qué vida intentamos devolver?"]}],final:"La familia aporta valores. El equipo formula la recomendación.",bridge:"No se eligen máquinas. Se reconstruye sentido.",notes:{say:"Cuando la familia dice ‘hagan todo’, muchas veces está diciendo ‘no lo abandonen’. La familia reconstruye valores; el equipo recomienda.",ask:"¿La familia decide técnica o ayuda a reconstruir valores?",tension:"tecnología como símbolo de amor versus valores del paciente",pause:"30 segundos"}},

      {id:"legal",type:"legal",enabled:true,nav:"Marco legal",eyebrow:"Chile · bioética · práctica clínica",title:"La ley no obliga a la obstinación terapéutica.",lead:"Obliga a informar, respetar, cuidar y documentar.",notes:{say:"Marco de legitimidad clínica, no defensa burocrática.",ask:"¿Qué debe quedar escrito?",tension:"miedo legal versus trazabilidad clínica",pause:"30 segundos",optionalReveal:"PRIVADO · NO PROYECTAR. La escena siguiente revela que los casos corresponden a su abuela, su padre y ella."}},
      {id:"revelacion-personal",type:"personalReveal",enabled:true,requires:"showPersonalReveal",nav:"Revelación",eyebrow:"Revelación final",title:"Estos no eran sólo casos clínicos.",lines:["La mujer de 83 años era mi abuela.","El hombre de 63 años era mi padre.","La paciente joven politraumatizada era yo."],final:"Por eso no puedo reducir la AET a “limitar”. En mi vida tuvo tres formas: respetar, detener y escalar.",notes:{say30:"Revelar de forma sobria. No dramatizar. Explicar que primero se presentaron como casos clínicos para que fueran razonados clínicamente.",time30:"1 min",presenterEnergy:"high",audienceValue:"core"}},
      {id:"cierre-sintesis",type:"closingSynthesis",enabled:true,nav:"Cierre",eyebrow:"Síntesis final",title:"Los tres casos no enseñan tres respuestas. Enseñan una pregunta.",question:"¿Qué tratamiento sigue siendo cuidado para esta persona, en este momento?",cases:[["RESPETAR","cuando el límite lo define una voluntad competente."],["DETENER","cuando la intervención perdió finalidad."],["ESCALAR","cuando la intensidad todavía es puente."]],final:"La AET no decide cuánto vale una vida. Decide cuándo un tratamiento deja de ser cuidado.",lead:"Prometer cuidado no es prometer intervención infinita. Es prometer presencia, verdad, alivio y juicio.",notes:{say:"Cerrar conectando los tres casos con la pregunta central: qué tratamiento sigue siendo cuidado.",ask:"¿Qué promete la medicina cuando ya no puede revertir?",tension:"intervención infinita versus presencia responsable",pause:"40 segundos"}},

    philosophers:[
      {id:"aristoteles",name:"Aristóteles",initial:"Α",concept:"phronesis · prudencia práctica",upcDilemma:"Paciente grave, incertidumbre, equipo dividido.",hallway:"¿Escalamos o esperamos?",phrase:"La buena decisión no siempre es la más intensa. Es la más prudente.",confusion:"Confundir prudencia con hacer menos.",distinction:"La prudencia decide bajo incertidumbre concreta, no por algoritmo.",question:"¿Qué acción realiza mejor el bien de este paciente, aquí y ahora?",effect:"Permite definir prueba limitada, no escalar por inercia y sostener intensidad cuando es puente.",warning:"No confundir prudencia con cobardía terapéutica.",modal:{cut:"prudencia / timidez",clinic:"La AET exige juicio situado, con objetivo, plazo y reevaluación.",example:"Escalar fue prudente cuando la UCI funcionó como puente.",warning:"No vuelve conservadora toda decisión difícil."}},
      {id:"kant",name:"Kant",initial:"K",concept:"dignidad · no instrumentalización",upcDilemma:"Familia exige seguir; el equipo escala para no parecer frío.",hallway:"La familia quiere todo.",phrase:"El paciente no puede ser medio para calmar angustias ajenas.",confusion:"Usar tecnología para calmar culpa, miedo legal o presión familiar.",distinction:"Dignidad exige tratar al paciente como fin, no como medio.",question:"¿Esta intervención sirve al paciente o sirve a nuestra angustia?",effect:"Ordena conflicto familiar, medicina defensiva y lenguaje de recomendación.",warning:"No reducir dignidad a firma de consentimiento.",modal:{cut:"paciente / medio de tranquilidad",clinic:"La intervención debe justificarse por el bien del paciente, no por aliviar al equipo.",example:"“Hagan todo” no transforma toda tecnología en indicación.",warning:"Autonomía no es trámite documental."}},

      {id:"ricoeur",name:"Ricoeur",initial:"R",concept:"identidad narrativa",upcDilemma:"El paciente sobrevive, pero el desenlace humano sigue abierto.",hallway:"Ya salió de UCI.",phrase:"No tratamos órganos aislados; tratamos una vida con historia.",confusion:"Reducir recuperación a supervivencia biológica.",distinction:"La vida recuperable incluye continuidad biográfica y valores.",question:"¿A qué vida puede volver este paciente?",effect:"Cambia cómo se interpreta alta, secuelas, fragilidad y desenlace funcional.",warning:"No usar biografía para negar tratamiento proporcionado.",modal:{cut:"sobrevivir / volver a una vida",clinic:"La pregunta no es sólo si vive, sino qué vida se intenta devolver.",example:"La ficha cierra antes que la historia.",warning:"La biografía orienta objetivos; no sentencia valor."}},
      {id:"levinas",name:"Levinas",initial:"L",concept:"rostro · vulnerabilidad",upcDilemma:"El paciente se volvió cama, diagnóstico, score y monitor.",hallway:"El SOFA está pésimo.",phrase:"El paciente no es sólo el caso.",confusion:"Ver sólo fisiología, monitor o score.",distinction:"Antes del dato hay una persona vulnerable que interpela.",question:"¿Estoy viendo al paciente o sólo su fisiología?",effect:"Devuelve sufrimiento, voluntad y carga al centro de la deliberación.",warning:"No romantizar sufrimiento; responder también es aliviar.",modal:{cut:"caso / rostro",clinic:"El monitor informa, pero no agota lo moralmente relevante.",example:"Paciente sedado o intubado sigue siendo alguien, no sólo variables.",warning:"La compasión sin proporcionalidad también puede dañar."}},
      {id:"pellegrino",name:"Pellegrino",initial:"P",concept:"bien del paciente",upcDilemma:"El tratamiento funciona técnicamente, pero ya no ayuda.",hallway:"Sólo una transfusión más.",phrase:"El éxito técnico no siempre equivale al bien del paciente.",confusion:"Identificar eficacia fisiológica con buena medicina.",distinction:"La medicina se legitima por orientación al bien real del enfermo.",question:"¿Cuál es el bien real del paciente en esta situación?",effect:"Permite detener transfusiones, ATB o VMNI cuando sostienen cifras sin objetivo.",warning:"No reducir el bien a preferencia aislada ni a parámetro.",modal:{cut:"éxito técnico / bien clínico",clinic:"Una intervención funciona moralmente sólo si sirve al paciente concreto.",example:"Sostener hemoglobina no siempre sostiene una vida recuperable.",warning:"El bien del paciente integra clínica, valores y alivio."}},
